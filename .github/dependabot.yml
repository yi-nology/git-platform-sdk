# Dependabot keeps the seven platform-SDK dependencies (gitea, forgejo,
# gitee, go-github, gitlab client-go, go-gitcode, gongfeng) and the CI
# workflow actions current. Direct SDK bumps land as individual PRs so each
# can ride the contract-test suite before merging.

version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
    # Security-relevant minors of platform SDKs change wire shapes; the
    # contract suites are the gate, so no extra reviewers config needed.
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
